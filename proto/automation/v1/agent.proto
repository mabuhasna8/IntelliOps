syntax = "proto3";

package automation.v1;

option go_package = "github.com/mabuhasna8/IntelliOps/proto/automation/v1;automationv1";

message AgentHello {
  string agent_id = 1;
  string env_id = 2;
}

message WorkRequest {
  uint32 slots = 1;
}

message TaskSpec {
  string task_id = 1;
  string run_id = 2;
  string node_id = 3;
  string workflow_id = 4;
  string env_id = 5;
}

message StatusUpdate {
  string task_id = 1;
  string phase = 2;   // PENDING/RUNNING/SUCCEEDED/FAILED
  string message = 3;
}

message LogFrame {
  string task_id = 1;
  string line = 2;
}

message Assignment {
  repeated TaskSpec tasks = 1;
}

message Control {
  string kind = 1;   // "DRAIN" | "CANCEL"
  string task_id = 2;
}

message Error {
  string code = 1;
  string message = 2;
}

message AgentMessage {
  oneof msg {
    AgentHello hello = 1;
    WorkRequest request = 2;
    StatusUpdate status = 3;
    LogFrame log = 4;
  }
}

message CoreMessage {
  oneof msg {
    Assignment assignment = 1;
    Control control = 2;
    Error error = 3;
  }
}

service AgentService {
  rpc WorkStream(stream AgentMessage) returns (stream CoreMessage);
}

